        <h1>Application Submitted</h1>

        <div class="admission-form" id="summary"></div>

    </footer>
    <script src="script.js"></script>
    <script>
        const p = new URLSearchParams(location.search);//find query string passed as url through get
        const labels = {name:"Full Name", email:"Email", dob:"Date of Birth", mob:"Mobile", gender:"Gender", course:"Course", address:"Address"};
        const box = document.getElementById("summary");
        if (!p.get("name")) {
            box.innerHTML = "<p>No application found. <a href='admission.html'>Fill the admission form</a>.</p>";
        } else {
            const ul = document.createElement("ul");
            ul.style.listStyle = "none";
            for (const k in labels) {
                const li = document.createElement("li");
                li.style.margin = "8px 0";
                const b = document.createElement("strong");
                b.textContent = labels[k] + ": ";
                li.append(b, document.createTextNode(p.get(k) || "-"));
                ul.appendChild(li);
            }
            const msg = document.createElement("p");
            msg.textContent = "Thank you, " + p.get("name") + "! Your application has been received.";
            box.append(msg, ul);
        }
    </script>
</body>
