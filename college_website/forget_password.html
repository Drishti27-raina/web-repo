<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="./style.css?v=3">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <h1>Forget Password</h1>
        <form  novalidate>
         <div class="input-box"> 
            <div> 
            <label for="password"> New Password:</label>
            </div> 
            <div>
            <input type="password" id="new_password" placeholder="Enter your new password" name="password" required>
            </div>
            </div>
        <div class="input-box">
            <div> 
            <label for="password"> ConfirmPassword:</label>
             </div> 
             <div>
            <input type="password" id="confirm_password" placeholder="Confirm password" name="password" required>
            </div>     
        </div> 
        <button  class="login-button"  type="submit" >Submit Password</button> 
        </form>
    </div>
    <script src="script.js?v=3" defer></script>//v=3 is used for cache busting mtlb js ke cache ko clear krdo aur updated changes dekho

    
</body>
</html>
