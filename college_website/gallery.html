    <div class="lightbox" id="lightbox">
        <button class="lb-close" aria-label="Close">&times;</button>
        <button class="lb-prev" aria-label="Previous">&#8249;</button>
        <img id="lb-img" alt="">
        <button class="lb-next" aria-label="Next">&#8250;</button>
    </div>
    <script>
        const imgs = [...document.querySelectorAll('.photo .box img')];
        const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img');
        let cur = 0;
        function show(i){ cur = (i + imgs.length) % imgs.length; lbImg.src = imgs[cur].src; lb.classList.add('open'); }
        function hide(){ lb.classList.remove('open'); }
        imgs.forEach((im, i) => im.addEventListener('click', () => show(i)));
        lb.querySelector('.lb-close').onclick = hide;
        lb.querySelector('.lb-prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
        lb.querySelector('.lb-next').onclick = e => { e.stopPropagation(); show(cur + 1); };
        lb.addEventListener('click', e => { if (e.target === lb) hide(); });
        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') hide();
            if (e.key === 'ArrowLeft') show(cur - 1);
            if (e.key === 'ArrowRight') show(cur + 1);
        });
    </script>
    <script src="script.js"></script>
