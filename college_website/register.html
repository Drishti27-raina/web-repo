<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body register-body">

    <div class="login-container register-container">
        <h1>Student Register</h1>
        <form id="register-form" novalidate>
            <div class="input-box">
                <div><label for="reg_name">Full Name:</label></div>
                <div><input type="text" id="reg_name" placeholder="Enter your full name" required></div>
            </div>
            <div class="input-box">
                <div><label for="reg_email">Email:</label></div>
                <div><input type="email" id="reg_email" placeholder="Enter your email" autocomplete="off" required></div>
            </div>
            <div class="input-box">
                <div><label for="reg_password">Password:</label></div>
                <div><input type="password" id="reg_password" placeholder="Create a password" required></div>
            </div>
            <div class="input-box">
                <div><label for="reg_confirm">Confirm Password:</label></div>
                <div><input type="password" id="reg_confirm" placeholder="Confirm password" required></div>
            </div>
            <button class="login-button" type="submit">Register</button>
            <div class="register">
                <p>Already have an account? <a href="student login.html">Login here</a></p>
            </div>
        </form>
    </div>
    <script src="script.js?v=3" defer></script>

</body>
</html>
