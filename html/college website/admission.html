        </div>
        
            <div class="head">

    </div>
       </div>

    </div>
    
    <main class="about-content">
        <h1> Student corner</h1>
        <div class="title-line"></div>
        <div class="admission-form"> 
            <form action="student1.html" method="get">
                <div>
                <label for="name" >Full Name *</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
              <div> 
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
               </div>
               <div>
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
                </div>
                <div>
                <label for="mob">Mobile Number *</label>
                <input type="tel" id="mob" name="mob" placeholder="Enter your mobile number" required>
            </div>
            <div>
                <label >Gender:</label>
                <input type="radio" id="male" name="gender" value="male"  placeholder="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" placeholder="Female" required>
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other" placeholder="Other" required>
                <label for="other">Other</label>    
              <div>  
                <label for="course">Course Applied For *</label>
                <select id="course" name="course" required>
                    <option value="">-Select course-</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="web-technology">Web Technology</option>
                </select>
                </div>
                
                <label for="address">Address *</label>
                <textarea id="address" name="address" required></textarea>
                </div>
                <div class="form-buttons">
                <button type="submit" value="Register">submit</button>
                <button type="reset" value="Reset">Reset</button>
                </div>
            </form>
        </div>
    </main>
    </header>
