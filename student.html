<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>
<body>
    
            <hr>
            <h3>STUDENT REGISTRATION FORM</h3>
            <form action="student1.html" method="get">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>
                <label for="mob">Mobile Number:</label>
                <input type="tel" id="mob" name="mob" placeholder="Enter your mobile number" required>
                <br><br>
                <label >Gender:</label>
                <input type="radio" id="male" name="gender" value="male"  placeholder="Male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" placeholder="Female" required>
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other" placeholder="Other" required>
                <label for="other">Other</label>    
                <br><br>
                <label for="course">course:</label>
                <select id="course" name="course" required>
                    <option value="">Select your course</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="web-technology">Web Technology</option>
                </select>
                <br><br>
                <label for="hobbies">Hobbies:</label>
                
                <label for="hobbies">Reading</label>
                <input type="checkbox" id="hobbies" name="hobbies">
                <label for="hobbies">Writing</label>
                <input type="checkbox" id="hobbies" name="hobbies">
                <label for="hobbies">Drawing</label>
                <input type="checkbox" id="hobbies" name="hobbies">
                <br><br>
                <label for="address">Address:</label>
                <textarea id="address" name="address" required></textarea>
                <br><br>
                <button type="submit" value="Register">submit</button>
                <button type="reset" value="Reset">Reset</button>
            </form>
        </table>
</body>
</html>
